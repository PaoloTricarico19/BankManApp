spring.application.name=BankManApp

#jdbc api standard inclusa in java connette i database relazionali
spring.datasource.url=jdbc:h2:mem:testdb

#permette a spring di poter comunicare con il database
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#Console web
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.jackson.serialization.fail-on-empty-beans=false

logging.file.name=logs/BankManApp.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.root=INFO

logging.level.com.tuoprogetto=DEBUG